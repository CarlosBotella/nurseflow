<!DOCTYPE html>
<html lang="es" data-theme="system">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0d9488">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>NurseFlow Pro</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="assets/icons/icon-180.png">
    
    <link rel="stylesheet" href="styles/tokens.css">
<link rel="stylesheet" href="styles/base.css">
<link rel="stylesheet" href="styles/layout.css">
<link rel="stylesheet" href="styles/components.css">
</head>
<body>

    <div id="appLock" class="hidden" role="dialog" aria-modal="true" aria-label="Desbloquear NurseFlow" tabindex="-1">
        <h1 class="text-primary mb-2 text-display">NurseFlow Pro</h1>
        <p class="muted" id="lockMsg">Introduce tu PIN de 6 dígitos</p>
        <div id="pinDots" class="pin-dots"></div>
        <div class="pin-grid" id="pinGrid"></div>
        <button id="bioUnlockBtn" class="btn primary hidden block mt-8 max-width-300px">Desbloquear con Biometría</button>
    </div>

    <div id="onboardingView" class="hidden" role="dialog" aria-modal="true" aria-label="Configuración inicial" tabindex="-1"></div>

    <header class="topbar">
        <div class="topbar-titles">
            <h1 id="pageTitle">Hoy</h1>
            <div id="contextLabel" class="context">NurseFlow Pro</div>
        </div>
        <div class="display-flex gap-1 items-center">
            <button class="btn icon-only" id="glovesToggle" data-action="toggleGloves" aria-label="Modo guantes" title="Modo guantes (tacto grande)">
                <svg aria-hidden="true" focusable="false" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"></path></svg>
            </button>
            <button class="btn icon-only" id="readonlyToggle" data-action="toggleReadOnly" aria-label="Modo solo lectura" title="Modo solo lectura (para tutor)">
                <svg aria-hidden="true" focusable="false" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
            </button>
            <button class="btn icon-only" data-action="openSlide" data-view="globalSearch" aria-label="Buscar">
                <svg aria-hidden="true" focusable="false" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
            </button>
            <button class="btn icon-only" data-action="openSlide" data-view="settingsMain" aria-label="Ajustes">
                <svg aria-hidden="true" focusable="false" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756 2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
            </button>
        </div>
    </header>

    <main id="app" class="container" tabindex="-1"></main>

    <nav class="bottom-nav" id="bottomNav" aria-label="Navegación principal">
        <button class="nav-item active" data-route="today">
            <svg aria-hidden="true" focusable="false" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
            Hoy
        </button>
        <button class="nav-item" data-route="university">
            <svg aria-hidden="true" focusable="false" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14l9-5-9-5-9 5 9 5z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0012 20.055a11.952 11.952 0 00-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14z"></path></svg>
            Agenda
        </button>
        <button class="nav-item" data-route="practicum">
            <svg aria-hidden="true" focusable="false" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
            Portfolio
        </button>
        <button class="nav-item" data-route="batea">
            <svg aria-hidden="true" focusable="false" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16"></path></svg>
            Batea
        </button>
        <button class="nav-item" data-route="study">
            <svg aria-hidden="true" focusable="false" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"></path></svg>
            Formación
        </button>
    </nav>

    <div id="slideOver" class="slide-over" role="dialog" aria-modal="true" aria-labelledby="slideOverTitle" tabindex="-1" inert>
        <div class="slide-over-header">
            <button class="btn icon-only" data-action="closeSlideOver" aria-label="Volver">
                <svg aria-hidden="true" focusable="false" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"></path></svg>
            </button>
            <h2 id="slideOverTitle">Detalle</h2>
            <div class="width-touch-target"></div>
        </div>
        <div id="slideOverContent" class="slide-over-content"></div>
    </div>

    <div id="modalOverlay" class="modal-overlay" inert>
        <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modalTitle" tabindex="-1">
            <h3 id="modalTitle" class="mb-2 text-section">Atención</h3>
            <div id="modalBody" class="text-text-muted text-body mb-6"></div>
            <div class="modal-actions" id="modalActions"></div>
        </div>
    </div>

    <input type="file" id="fileImport" class="hidden" accept=".json">
    <div id="toast" class="toast" role="status" aria-live="polite" aria-atomic="true">
        <div class="toast-icon" id="toastIcon">✓</div>
        <div id="toastMsg">Mensaje</div>
    </div>

    <script defer src="scripts/app.js"></script>
    <script defer src="scripts/ui.js"></script>
</body>
</html>
