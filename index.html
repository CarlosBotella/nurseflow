<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f6f8fb" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="NurseFlow" />
  <meta name="description" content="PWA local-first para organizar universidad, prácticum y estudio de Enfermería." />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" href="./assets/icons/icon-180.png" />
  <link rel="icon" href="./assets/icons/icon-192.png" />
  <link rel="stylesheet" href="./styles.css" />
  <title>NurseFlow</title>
</head>
<body>
  <div id="installBanner" class="install-banner hidden">
    <div><strong>Instalar NurseFlow</strong><span>Añádela a tu pantalla de inicio para usarla como app.</span></div>
    <button id="installBtn" class="btn primary">Instalar</button>
    <button id="installClose" class="icon-btn" aria-label="Cerrar">×</button>
  </div>

  <header class="topbar">
    <div>
      <p id="contextLabel" class="eyebrow">Modo estudiante</p>
      <h1 id="pageTitle">Hoy</h1>
    </div>
    <button id="quickSearchBtn" class="icon-btn search-btn" aria-label="Buscar">⌕</button>
  </header>

  <main id="app" class="app-shell" aria-live="polite"></main>

  <nav class="bottom-nav" aria-label="Navegación principal">
    <button data-route="today" class="nav-item active"><span>⌂</span><small>Hoy</small></button>
    <button data-route="university" class="nav-item"><span>▦</span><small>Universidad</small></button>
    <button data-route="practicum" class="nav-item"><span>✚</span><small>Prácticum</small></button>
    <button data-route="consult" class="nav-item"><span>⌕</span><small>Consulta</small></button>
    <button data-route="study" class="nav-item"><span>◫</span><small>Estudio</small></button>
  </nav>

  <dialog id="modal" class="modal"><div id="modalContent"></div></dialog>
  <div id="toast" class="toast hidden"></div>

  <script src="./db.js"></script>
  <script src="./app.js"></script>
</body>
</html>
